[package]
name = "write-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "write_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
imagesize = "0.14"
write-core = { path = "../write-core" }
write-render = { path = "../write-render" }
write-store = { path = "../write-store" }
