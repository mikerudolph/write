[package]
name = "write_core"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "make-fixture"
path = "src/bin/make_fixture.rs"

[[bin]]
name = "core-bench"
path = "src/bin/core_bench.rs"

[[bin]]
name = "render-samples"
path = "src/bin/render_samples.rs"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = "0.45"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
